<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Admin — Baji666</title><link rel="stylesheet" href="style.css"></head><body><header><b>Baji666 <span>DEMO ADMIN</span></b><nav><a href="index.html">সাইট</a><a href="aviator.html">Aviator</a></nav></header><main><div class="panel"><h1>⚙️ Demo Admin Panel</h1><div class="notice">শুধু ডেমো/টেস্ট কনফিগারেশন। কোনো বাস্তব payment বা player outcome control নেই।</div><label>Demo Payment Number</label><input id="num" value="01XXXXXXXXX"><button onclick="saveNum()">Save Demo Number</button><p id="n"></p><label>Next Aviator Test Multiplier</label><input id="mul" type="number" min="1.01" step=".01" value="2.50"><button onclick="saveMul()">Save Test Result</button><p id="m"></p></div></main><script>
function saveNum(){localStorage.demoNumber=document.querySelector('#num').value;document.querySelector('#n').textContent='Saved: '+localStorage.demoNumber}
function saveMul(){let x=+document.querySelector('#mul').value;if(x>=1.01){localStorage.demoMultiplier=x;document.querySelector('#m').textContent='Next test multiplier: '+x.toFixed(2)+'x'}}
</script></body></html>
